services:
  - type: web
    name: microlins-curriculos
    runtime: static
    buildCommand: echo "Site estatico pronto"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
